<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full solid background without rounded corners for clean PWA display -->
  <rect width="512" height="512" fill="url(#bg-gradient)"/>
  
  <!-- Subtle inner glow for depth - smaller, centered -->
  <rect x="32" y="32" width="448" height="448" fill="url(#inner-glow)" fill-opacity="0.2"/>
  
  <!-- Main house/H mark - centered with safe margins for icon masking -->
  <path d="M256 100L108 220V420H180V316C180 304.954 188.954 296 200 296H312C323.046 296 332 304.954 332 316V420H404V220L256 100Z" fill="white" fill-opacity="0.95"/>
  
  <!-- Inner structure - representing harmony and organization -->
  <path d="M256 160L168 228V340H212V276C212 270.477 216.477 266 222 266H290C295.523 266 300 270.477 300 276V340H344V228L256 160Z" fill="url(#bg-gradient)" fill-opacity="0.25"/>
  
  <!-- Connection bridge - symbolizing teamwork -->
  <rect x="222" y="310" width="68" height="14" rx="7" fill="url(#bg-gradient)" fill-opacity="0.35"/>
  
  <!-- Excellence sparkle - moved inward to avoid edge clipping -->
  <circle cx="380" cy="130" r="22" fill="#FBBF24"/>
  <circle cx="380" cy="130" r="14" fill="#FDE047"/>
  <circle cx="408" cy="102" r="10" fill="#FBBF24" fill-opacity="0.7"/>
  <circle cx="414" cy="152" r="7" fill="#FBBF24" fill-opacity="0.5"/>
  
  <!-- Subtle star accent -->
  <path d="M380 118L383 126L391 130L383 134L380 142L377 134L369 130L377 126L380 118Z" fill="white" fill-opacity="0.9"/>
  
  <defs>
    <!-- Premium emerald-teal gradient - trust, growth, harmony -->
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    
    <!-- Inner glow for premium depth -->
    <radialGradient id="inner-glow" cx="0.5" cy="0.3" r="0.7" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
